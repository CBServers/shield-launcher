name: Build

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Release
    steps:
      - name: Set Git to use LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out files
        uses: actions/checkout@v4.2.0
        with:
          submodules: true
          fetch-depth: 0
          lfs: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        run: ./generate.bat

      - name: Restore NuGet packages
        run: msbuild /t:restore /p:RestorePackagesConfig=true build/Shield_launcher.slnx

      - name: Set up problem matching
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build ${{matrix.configuration}}
        run: msbuild /m /v:minimal /p:Configuration=${{matrix.configuration}} /p:Platform=x64 build/Shield_launcher.slnx

      - name: Package release tree
        if: matrix.configuration == 'Release'
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1 -Configuration ${{matrix.configuration}} -ZipPath project-bo4-launcher.zip

      # The CB updater's upstream-updates workflow picks this release up and opens a PR with it plus upstream's game content
      - name: Publish launcher release
        if: matrix.configuration == 'Release' && github.repository_owner == 'CBServers' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path source/launcher/version.hpp -Pattern 'LAUNCHER_VERSION "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "v$version-cb.${{ github.run_number }}"
          $sha = "${{ github.sha }}"
          gh release create $tag project-bo4-launcher.zip --target $sha --title "Launcher $version (CB build ${{ github.run_number }})" --notes "Built from $sha." --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Ask the updater to check for it
        if: matrix.configuration == 'Release' && github.repository_owner == 'CBServers' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: gh workflow run upstream-updates.yml -R CBServers/updater -f client=project-bo4
